[RadarPlus]
; 0 turns RadarPlus off without uninstalling it.
Enabled=1
; 1 follows the player's position so the map overlay works. 0 keeps only size, shape and range.
LiveMap=1

; Hotkeys while playing. They change the matching MODS menu setting, which is then saved.
; Names: PageUp, PageDown, Plus (the +/= key), Minus, Home, End, Insert, Delete, F1..F24,
; NumpadAdd, NumpadSubtract, LeftBracket, RightBracket, a letter or digit, or a code like 0x21.
; None turns a key off. The menu descriptions pick up changes after a game restart.
ZoomInKey=PageUp
ZoomOutKey=PageDown
SizeUpKey=Plus
SizeDownKey=Minus

; 1 writes extra details to RadarPlus.log (useful for bug reports).
Diagnostics=0
; 1 saves the game's HUD files to the uidump folder (only for mod development).
DumpUI=0
